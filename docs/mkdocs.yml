site_name: GilmanLab
site_description: Centralized architecture, decision, design, reference, and operations documentation for GilmanLab
site_url: https://docs.gilman.io/root/
repo_name: GilmanLab/root
repo_url: https://github.com/GilmanLab/root
edit_uri: edit/master/docs/docs/
docs_dir: docs
site_dir: build
strict: true

theme:
  name: material
  language: en
  features:
    - content.action.edit
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Decisions:
      - "ADR-0001: Use VyOS for Layer 3 and Dedicated Switches for Layer 2": decisions/0001-use-vyos-for-layer-3-and-switches-for-layer-2.md
      - "ADR-0002: Manage the Tailnet Policy File with GitOps": decisions/0002-manage-tailscale-policy-with-gitops.md
      - "ADR-0003: Use AWS KMS with PGP Recovery for Secrets": decisions/0003-use-kms-with-pgp-recovery-for-secrets.md
      - "ADR-0004: Manage RouterOS Devices with OpenTofu": decisions/0004-manage-routeros-devices-with-opentofu.md
      - "ADR-0005: Anchor Internal PKI on the KMS Root with Sibling Intermediates": decisions/0005-anchor-internal-pki-on-kms-root-with-sibling-intermediates.md
      - "ADR-0006: OVN as the Sandbox Network Fabric": decisions/0006-ovn-as-the-sandbox-network-fabric.md
  - Designs:
      - Lab v2 core network: designs/lab-v2-core-network.md
      - "Draft: agentcompute": designs/drafts/agentcompute.md
  - Reference:
      - Device naming: reference/naming.md
      - Hardware inventory: reference/hardware-inventory.md
      - Agentcompute Phase 7 qualification: reference/agentcompute/phase7.md
      - Networking:
          - Address and VLAN plan: reference/networking/address-plan.md
          - Hardware: reference/networking/hardware.md
          - Physical connections: reference/networking/physical-connections.md
          - Tailscale policy: reference/networking/tailscale-policy.md
  - Runbooks:
      - Change the Tailscale policy: runbooks/tailscale-policy-change.md
      - Deploy and operate agentcompute: runbooks/agentcompute-service.md
      - Authorize agentcompute SSH to Studio: runbooks/agentcompute-studio-ssh.md
      - Commission a lab compute node: runbooks/commission-lab-node.md
      - Operate OVN central and certificates: runbooks/ovn-central-and-certificates.md
      - Rebuild nas01: runbooks/rebuild-nas01.md
      - Manage the sw-core01 configuration: runbooks/sw-core01-configuration.md
      - Manage the sw-mgmt01 configuration: runbooks/sw-mgmt01-configuration.md
      - Deploy the VyOS gateway configuration: runbooks/vyos-gateway-deployment.md
      - Deploy private image runners: runbooks/private-image-runners.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
